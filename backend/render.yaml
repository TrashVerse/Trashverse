services:
  - type: web
    name: trashverse-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: DATABASE_URL
        fromDatabase:
          name: trashverse-db
          property: connectionString
      - key: FIREBASE_CREDENTIALS_PATH
        value: ./firebase-credentials.json
      - key: RESEND_API_KEY
        value: re_imeqaLTJ_LMycHLq3YEs1R9XAiHqD9VvW
      - key: DEFAULT_FROM_EMAIL
        value: onboarding@resend.dev
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: EMAIL_MODE
        value: production
      - key: DEV_EMAIL_RECIPIENT
        value: onyewuchiscepter@gmail.com
      - key: ENVIRONMENT
        value: production

databases:
  - name: trashverse-db
    databaseName: trashverse
    user: trashverse_user
    plan: starter